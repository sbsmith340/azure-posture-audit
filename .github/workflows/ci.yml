name: ci

on:
  push:
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      - name: Re-run the audit; fail if committed reports are stale
        run: python tools/audit.py --check
      - run: pytest -q tests
